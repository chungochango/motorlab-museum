  <!-- Nivel de negro por píxel (igual que en las salas): el fondo gris de estudio
       de las fotos pasa a negro puro #000 sin desenfocar nada. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="blackpoint" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.1628" intercept="-0.1628" />
        <feFuncG type="linear" slope="1.1628" intercept="-0.1628" />
        <feFuncB type="linear" slope="1.1628" intercept="-0.1628" />
      </feComponentTransfer>
    </filter>
    <!-- Negro OLED suave: lleva a #000 sólo los niveles 0–10 sin tocar los colores (el Hall usa #blackpoint en sus fotos) -->
    <filter id="oled" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncR type="linear" slope="1.04" intercept="-0.04" /><feFuncG type="linear" slope="1.04" intercept="-0.04" /><feFuncB type="linear" slope="1.04" intercept="-0.04" /></feComponentTransfer>
    </filter>
  </svg>
